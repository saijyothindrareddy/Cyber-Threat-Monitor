{% extends "base.html" %}

{% block title %}
Audit Logs
{% endblock %}

{% block content %}

<div class="container-fluid">

<h2 class="mb-4">
📋 Audit Logs
</h2>

<div class="card p-4">

<table class="table table-dark table-striped">

<thead>

<tr>
<th>ID</th>
<th>User</th>
<th>Action</th>
<th>Timestamp</th>
</tr>

</thead>

<tbody>

{% for log in logs %}

<tr>

<td>{{ log.id }}</td>

<td>{{ log.username }}</td>

<td>{{ log.action }}</td>

<td>{{ log.timestamp }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

{% endblock %}
