<!DOCTYPE html>
<html>

<head>

<title>SOC Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:linear-gradient(135deg,#0f172a,#020617);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Segoe UI,sans-serif;
}

.login-card{
width:420px;
background:#1e293b;
padding:35px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,0.5);
color:white;
}

.logo{
font-size:28px;
font-weight:bold;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:25px;
}

</style>

</head>

<body>

<div class="login-card">

<div class="logo">
🛡 SOC Security Center
</div>

<div class="subtitle">
Cyber Threat Monitoring Platform
</div>

<form method="POST">

<input
type="text"
name="username"
class="form-control mb-3"
placeholder="Username"
required>

<input
type="password"
name="password"
class="form-control mb-3"
placeholder="Password"
required>

<button
class="btn btn-danger w-100">
Login
</button>

</form>

</div>

</body>

</html>
