<!DOCTYPE html>
<html>

<head>

<title>Attack Logs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
}

.table{
background:#1e293b;
}

.search-box{
background:#1e293b;
border:none;
color:white;
}

.badge-danger{
background:#ef4444;
}

.badge-success{
background:#22c55e;
}

.badge-warning{
background:#f59e0b;
}

</style>

</head>

<body>

<div class="container mt-4">

<h2 class="mb-3">⚠ Security Attack Logs</h2>

<input id="searchInput" class="form-control search-box mb-3" placeholder="Search attacker IP or username...">

<table class="table table-dark table-striped">

<thead>

<tr>
<th>Timestamp</th>
<th>Attack Type</th>
<th>Target User</th>
<th>Attacker IP</th>
<th>Severity</th>
</tr>

</thead>

<tbody id="logsTable">

{% for alert in alerts %}

<tr>

<td>{{ alert.timestamp }}</td>

<td>
<span class="badge bg-danger">Brute Force Attack</span>
</td>

<td>{{ alert.user }}</td>

<td>{{ alert.ip }}</td>

<td>
<span class="badge bg-warning">High</span>
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

<script>

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("keyup", function() {

let filter = searchInput.value.toLowerCase();
let rows = document.querySelectorAll("#logsTable tr");

rows.forEach(row => {

let text = row.innerText.toLowerCase();

if(text.includes(filter)){
row.style.display = "";
}
else{
row.style.display = "none";
}

});

});

</script>

</body>

</html>
